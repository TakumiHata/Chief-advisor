services:
  image-analysis:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CA_DEBUG=true
      - CA_CHROMA_HOST=chromadb
      - CA_CHROMA_PORT=8100
      - CA_YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    volumes:
      - replay-data:/app/data
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma-data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  replay-data:
  chroma-data:
  ollama-data:
